<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="island">
        <div class="musicUI">
            <img src="https://upload.wikimedia.org/wikipedia/en/e/e6/The_Weeknd_-_Blinding_Lights.png" alt="">
            <div class="songAlbum">
                <div class="title">Blinding Lights</div>
                <div class="artist">The Weekend</div>
            </div>

            <div class="progresBar">
                <div class="progress"></div>
                <div class="controls">
                    <button>⏮</button>
                     <button>▶</button>
                     <button>⏭</button>
                </div>
            </div>
            
        </div>
        <div class="idleUI"></div>
        <div class="faceID_UI"></div>
        <div class="callUI"></div>
        <div class="timerUI"></div>
    </div>

    <div class="buttons">
        <button class="musicButton">Toggle for music</button>
        <button class="faceId">FaceID</button>
        <button class="call">Use Call</button>
    </div>
    
</body>
<script src="script.js"></script>
</html>
